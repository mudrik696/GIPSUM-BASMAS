<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin – GIPSUM BASMAS UKKI PENS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="w">
      <section class="sec">
        <h2>Panel Bendahara</h2>
        <div class="card" id="lgn">
          <label for="le">Email</label>
          <input id="le" type="email" autocomplete="username">
          <label for="lp">Password</label>
          <input id="lp" type="password" autocomplete="current-password">
          <p class="login-actions"><button class="btn" id="lb" type="button">Login</button></p>
          <p id="lm" class="err" aria-live="polite"></p>
        </div>
        <div id="pn" hidden>
          <p><button class="btn o" id="lo" type="button">Logout</button></p>
          <p id="pm" class="err" aria-live="polite"></p>
          <div class="card admin-card">
            <h3>Verifikasi Donatur</h3>
            <div class="tw">
              <table>
                <thead>
                  <tr><th>Tanggal</th><th>Nama</th><th>Kontak</th><th>Jenis</th><th>Program</th><th>Jumlah</th><th>Aksi</th></tr>
                </thead>
                <tbody id="dn"></tbody>
              </table>
            </div>
          </div>
          <div class="card admin-card">
            <h3>Catat Pengeluaran</h3>
            <div class="row">
              <div><label for="ed">Tanggal</label><input id="ed" type="date"></div>
              <div><label for="ep">Program</label><select id="ep"></select></div>
            </div>
            <div class="row">
              <div><label for="ek">Keterangan</label><input id="ek"></div>
              <div><label for="ej">Jumlah (Rp)</label><input id="ej" type="number" min="1"></div>
            </div>
            <p><button class="btn" id="eb" type="button">Simpan</button></p>
          </div>
        </div>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/admin.js" defer></script>
  </body>
</html>
